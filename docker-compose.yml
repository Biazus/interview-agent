services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      vector-db:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://interview:interview@postgres:5432/interview_agent
      QDRANT_HOST: vector-db
      QDRANT_PORT: 6333
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./app:/app/app

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
      POSTGRES_DB: interview_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  vector-db:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  seed:
    build: .
    profiles: ["seed"]
    depends_on:
      vector-db:
        condition: service_started
    environment:
      QDRANT_HOST: vector-db
      QDRANT_PORT: 6333
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: uv run python scripts/run_seed.py

  localstack:
    image: localstack/localstack:latest
    profiles: ["messaging"]
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,sns,lambda

volumes:
  postgres_data:
  qdrant_data:
