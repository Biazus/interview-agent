services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - vector-db
    volumes:
      - ./app:/app/app

  vector-db:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  localstack:
    image: localstack/localstack:latest
    profiles: ["messaging"]
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,sns,lambda

volumes:
  qdrant_data: