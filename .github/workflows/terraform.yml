name: Terraform

"on":
  pull_request:
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: infra

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      TF_VAR_github_repo_url: ${{ vars.TF_VAR_github_repo_url }}
      TF_VAR_cors_origins: ${{ vars.TF_VAR_cors_origins }}
      TF_VAR_supabase_project_ref: ${{ vars.TF_VAR_supabase_project_ref }}
      TF_VAR_database_url: ${{ secrets.TF_VAR_database_url }}
      TF_VAR_groq_api_key: ${{ secrets.TF_VAR_groq_api_key }}
      TF_VAR_openrouter_api_key: ${{ secrets.TF_VAR_openrouter_api_key }}
      TF_VAR_qdrant_cluster_id: ${{ vars.TF_VAR_qdrant_cluster_id }}
      TF_VAR_qdrant_cluster_endpoint: ${{ vars.TF_VAR_qdrant_cluster_endpoint }}
      TF_VAR_qdrant_cluster_api_key: ${{ secrets.TF_VAR_qdrant_cluster_api_key }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: terraform plan -input=false

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve -input=false
