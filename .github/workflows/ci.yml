# Lembrar de Trocar required check de "test" para "ci-success" e remover "test" dos required

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
        id: filter
        with:
          filters: |
            backend:
              - 'app/**'
              - 'tests/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'alembic/**'
              - 'alembic.ini'
              - '.github/workflows/**'
              - '.pre-commit-config.yaml'

  test:
    needs: changes
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://interview:interview@localhost:5432/interview_agent_test
      GROQ_API_KEY: test
      OPENROUTER_API_KEY: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: interview
          POSTGRES_PASSWORD: interview
          POSTGRES_DB: interview_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interview -d interview_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Seed Qdrant
        run: uv run python scripts/run_seed.py

      - name: Smoke import fastembed embedder
        run: uv run python -c "from fastembed import TextEmbedding; from app.core.rag.embeddings import EmbeddingProvider"

      - name: Run unit tests
        run: uv run pytest tests/unit

      - name: Run API tests
        run: uv run pytest tests/api

      - name: Run integration tests
        run: uv run pytest tests/integration

      - name: Lint (ruff)
        run: uv run ruff check app tests scripts

      - name: Check formatting (ruff)
        run: uv run ruff format --check app tests scripts

      - name: Check runtime deps exclude torch stack
        run: bash scripts/ci/check_no_torch.sh

      - name: Build Docker image
        run: docker build -t interview-agent-api:ci .

      - name: Check Docker image size (650 MB gate)
        run: bash scripts/ci/check_image_size.sh interview-agent-api:ci


  ci-success:
    name: ci-success
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Validate CI outcome
        run: |
          # 1. changes falhou: CI falha (não sabemos o que mudou)
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes job failed — cannot determine scope"
            exit 1
          fi

          # 2. backend mudou OU dispatch manual: test deve ter passado
          if [ "${{ needs.changes.outputs.backend }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ needs.test.result }}" != "success" ]; then
              echo "test job required but result was: ${{ needs.test.result }}"
              exit 1
            fi
          fi

          # 3. backend não mudou (push/PR) → test skipped é OK
          echo "CI success"
