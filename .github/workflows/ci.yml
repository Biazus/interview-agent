name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://interview:interview@localhost:5432/interview_agent_test
      GROQ_API_KEY: test
      OPENROUTER_API_KEY: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: interview
          POSTGRES_PASSWORD: interview
          POSTGRES_DB: interview_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interview -d interview_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Seed Qdrant
        run: uv run python scripts/run_seed.py

      - name: Smoke import fastembed embedder
        run: uv run python -c "from fastembed import TextEmbedding; from app.core.rag.embeddings import EmbeddingProvider"

      - name: Run unit tests
        run: uv run pytest tests/unit

      - name: Run API tests
        run: uv run pytest tests/api

      - name: Run integration tests
        run: uv run pytest tests/integration

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Check formatting (ruff)
        run: uv run ruff format --check .

      - name: Build Docker image
        run: docker build -t interview-agent-api:ci .

      - name: Log Docker image size
        run: |
          SIZE_BYTES=$(docker image inspect --format='{{.Size}}' interview-agent-api:ci)
          python3 - <<EOF
          size_bytes = int("${SIZE_BYTES}")
          size_mb = size_bytes / (1024 * 1024)
          print(f"Docker image size: {size_bytes} bytes ({size_mb:.2f} MB)")
          EOF
