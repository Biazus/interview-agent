[tool.uv]
package = false

[project]
name = "interview-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Miller", email = "miller_br@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "email-validator>=2.0",
    "fastapi>=0.141.1",
    "groq>=1.6.0",
    "openai>=3.0.0",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=5.7.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.52.3",
]

[project.scripts]
interview-agent = "interview_agent:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pre-commit>=4.6.2",
    "pytest-asyncio>=1.4.0",
    "ruff==0.6.1",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: requer Qdrant, Postgres ou carrega SentenceTransformer",
]
