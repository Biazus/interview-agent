[tool.uv]
package = false

[project]
name = "interview-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Miller", email = "miller_br@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "email-validator>=2.0",
    "fastembed>=0.6.0",
    "fastapi>=0.141.1",
    "groq>=1.6.0",
    "openai>=3.0.0",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.52.3",
]

[project.scripts]
interview-agent = "interview_agent:main"

[dependency-groups]
dev = [
    "coverage[toml]>=7.6",
    "httpx>=0.28",
    "pre-commit>=4.6.2",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0",
    "ruff==0.6.1",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: requer Qdrant, Postgres ou carrega fastembed (ONNX)",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/bootstrap.py",
    "app/core/db/engine.py",
    "app/core/db/session.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.paths]
source = ["app", "*/interview-agent/app"]
